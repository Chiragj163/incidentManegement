name: Incident Management Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Incident Management
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host " Starting Incident Management Deployment"
          Write-Host "========================================="

          $script = "D:\IncidentManagement\deploy\deploy.ps1"

          if (-not (Test-Path $script)) {
              throw "Deployment script not found: $script"
          }

          Write-Host ""
          Write-Host "Running deployment script..."

          & powershell.exe `
              -NoProfile `
              -ExecutionPolicy Bypass `
              -File $script

          if ($LASTEXITCODE -ne 0) {
              throw "Deployment failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " DEPLOYMENT SUCCESSFUL"
          Write-Host " LIVE SITE UPDATED"
          Write-Host "========================================="